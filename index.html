<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Preparation Tracker</title><link rel="stylesheet" href="style.css">

</head>
<body><h1>My Placement Preparation Tracker</h1>

<p>Track your coding practice here!</p>

<h2>Add a Coding Problem</h2>

<input
    type="text"
    id="problemName"
    placeholder="Enter problem name"
>

<select id="difficulty">
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
</select>

<button onclick="addProblem()">Add Problem</button>

<h2>My Problems</h2>
<p id="progress">Total Problems: 0 | Completed: 0 | Pending: 0</p>
<ul id="problemList"></ul>

<ul id="problemList"></ul>

<script src="script.js"></script>

</body>
</html>
